[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paris-sportifs-p0"
version = "0.1.0"
description = "Prototype P0 : moteur probabiliste et backtest walk-forward (football, 1N2 et plus/moins 2,5)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "pyarrow>=14", "requests>=2.31", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
p0 = "p0.cli:main"

[tool.setuptools.packages.find]
include = ["p0*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
